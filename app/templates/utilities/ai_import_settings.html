{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <h1 class="mb-4">AI Import Settings</h1>

  <form method="post" class="card">
    <div class="card-body">
      <div class="mb-3">
        <label for="model_name" class="form-label">OpenAI Model</label>
        <input type="text" id="model_name" name="model_name" class="form-control" value="{{ settings.model_name }}">
        <div class="form-text">Use a PDF-capable Responses model such as <code>gpt-4o</code>. The server still reads the API key from <code>.env</code> via <code>OPENAI_API_KEY</code>.</div>
      </div>

      <div class="mb-3">
        <label for="max_retry_count" class="form-label">Max Retry Count</label>
        <input type="number" id="max_retry_count" name="max_retry_count" min="1" class="form-control" value="{{ settings.max_retry_count }}">
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="auto_import_confident" name="auto_import_confident" {% if settings.auto_import_confident %}checked{% endif %}>
        <label class="form-check-label" for="auto_import_confident">
          Auto-import confident documents
        </label>
      </div>
    </div>

    <div class="card-footer">
      <button type="submit" class="btn btn-primary">Save Settings</button>
      <a href="{{ url_for('utilities.index') }}" class="btn btn-secondary ms-2">Back</a>
    </div>
  </form>
</div>
{% endblock %}
