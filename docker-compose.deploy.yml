services:
  app:
    image: podaccounting:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    env_file:
      - ./.env
    environment:
      FLASK_APP: pod_accounting.py
      FLASK_ENV: production
      DATABASE_URL: sqlite:////data/pod_accounting.db
      EXPENSE_INVOICE_UPLOAD_DIR: /data/expense_invoices
    volumes:
      - ${APP_DATA_DIR:-/srv/apps_data/pod_accounting}:/data
